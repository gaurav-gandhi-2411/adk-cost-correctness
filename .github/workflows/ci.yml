name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Cache uv's downloads keyed on uv.lock, and keep pre-built wheels in it. setup-uv's defaults
      # (cache keyed on *requirements*.txt, prune-cache: true) dropped every pre-built wheel before
      # saving, so each job re-downloaded all 61 packages from PyPI -- including adk-tracegauge,
      # whose PyPI download counts are the launch-window adoption metric (CONTRIBUTIONS.md,
      # 2026-11-03). With this a repeat run installs from the cache and does not hit PyPI.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      # Fails if pyproject.toml changed without re-running `uv lock`.
      - name: Lockfile is current
        run: uv lock --check
      # Installs exactly what uv.lock pins, dev group included. Both adapters' tools are installed so
      # their adapter tests run; the suite itself needs neither.
      - name: Install
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen mypy src/
      - name: Tests
        run: uv run --frozen python -m pytest -q
