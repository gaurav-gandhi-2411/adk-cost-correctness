name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      # Fails if pyproject.toml changed without re-running `uv lock`.
      - name: Lockfile is current
        run: uv lock --check
      # Installs exactly what uv.lock pins, dev group included. Both adapters' tools are installed so
      # their adapter tests run; the suite itself needs neither.
      - name: Install
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen mypy src/
      - name: Tests
        run: uv run --frozen python -m pytest -q
