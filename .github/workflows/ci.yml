name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Both adapters' tools are installed so their adapter tests run; the suite itself needs neither.
      - name: Install
        run: python -m pip install -e ".[adk-tracegauge,adk-finops]" "pytest>=9.0.3,<10" "ruff>=0.15,<1" "mypy>=2.3,<3"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src/
      - name: Tests
        run: python -m pytest -q
